name: Blog Editorial V2 Validation

on:
  push:
    branches:
      - feature/blog-editorial-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-blog-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Install dependencies (locked)
        run: bun install --frozen-lockfile

      - name: Run Blog Editorial V2 contract tests
        run: bunx --no-install vitest run src/features/blog/*.test.ts

      - name: Build application
        run: bun run build

      - name: Verify generated route tree is synchronized
        run: git diff --exit-code -- src/routeTree.gen.ts
