name: Blog Editorial V2 Validation

on:
  push:
    branches:
      - feature/blog-editorial-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-blog-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Blog Editorial V2 contract tests
        run: npx vitest run src/features/blog/*.test.ts

      - name: Build application
        run: npm run build

      - name: Commit officially generated route tree when changed
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "routeTree.gen.ts already synchronized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routeTree.gen.ts
            git commit -m "chore(router): sync generated route tree"
            git push origin HEAD:feature/blog-editorial-v2
          fi

      - name: Read live robots.txt for Phase 3-X.2E
        run: |
          echo ROBOTS_HTTP_BEGIN
          curl --fail-with-body --silent --show-error --location --max-time 20 \
            --dump-header /tmp/robots-headers.txt \
            --output /tmp/robots-body.txt \
            https://vejamais.com.br/robots.txt || true
          echo "--- headers ---"
          cat /tmp/robots-headers.txt 2>/dev/null || true
          echo "--- body ---"
          cat /tmp/robots-body.txt 2>/dev/null || true
          echo ROBOTS_HTTP_END
