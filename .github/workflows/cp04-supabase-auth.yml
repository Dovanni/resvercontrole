name: CP-04 Real Supabase Auth Gate
on:
  push:
    branches: [feat/contas-pagar-edicao-coletiva-segura]
    paths:
      - 'tests/cp04/supabase-auth-*'
      - 'docs/cp04-production-rpc-review.sql'
      - '.github/workflows/cp04-supabase-auth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local Supabase (no remote project link)
        run: |
          supabase --version
          supabase start
      - name: Set up disposable database and RPC
        run: |
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/cp04/supabase-auth-fixture.sql
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f docs/cp04-production-rpc-review.sql
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "GRANT EXECUTE ON FUNCTION public.edit_payables_series_cp04(uuid,uuid,text,numeric,date,jsonb) TO authenticated;"
      - name: Run real GoTrue JWT through PostgREST
        run: |
          export CP04_ANON_KEY="$(supabase status -o env | sed -n 's/^ANON_KEY=//p' | tr -d '"')"
          test -n "$CP04_ANON_KEY"
          python3 tests/cp04/supabase-auth-integration.py
      - if: always()
        run: supabase stop --no-backup || true
